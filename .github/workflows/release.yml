name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Linux x86_64 release
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@48b64ba94bc1a6fe819fd9afc0799a7647efdc65 # v1.93.0

      - name: Verify tag matches package version
        id: version
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lanprint") | .version')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="lanprint-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          package_dir="lanprint-${VERSION}-x86_64-unknown-linux-gnu"
          staging="$RUNNER_TEMP/$package_dir"
          mkdir -p "$staging" dist
          install -m 0755 target/release/lanprint "$staging/lanprint"
          install -m 0644 README.md README.en.md LICENSE "$staging/"
          install -m 0644 deploy/lanprint.service "$staging/lanprint.service"
          tar -C "$RUNNER_TEMP" -czf "dist/$archive" "$package_dir"
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Save release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanprint-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.sha256 \
              --verify-tag \
              --title "Lanprint $tag" \
              --generate-notes
          fi
